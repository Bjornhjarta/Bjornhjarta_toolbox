name: Windows build, tests and RC artifact
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate, test and publish Windows preview
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Upload Windows preview and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Bjornhjarta-v1.0.0-rc2-win-x64
          path: |
            artifacts/Bjornhjarta-v1.0.0-rc2-win-x64-portable.zip
            artifacts/package-manifest.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      # UI smoke is intentionally a separate interactive-desktop gate, not run on CI.
